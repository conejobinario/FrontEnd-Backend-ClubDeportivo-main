<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - SportClub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
      #mainNav { background-color: #2E1A47; }
      #mainNav .nav-link { color: white !important; }
      .btn-primary-custom { background-color: #2E1A47; color: white; border: none; }
      .btn-primary-custom:hover { background-color: #3d225e; color: white; }
    </style>
  </head>
  <body class="bg-light">

    <nav id="mainNav" class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-white" href="index.html">SportClub</a>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card shadow border-0">
              <div class="card-body p-5">
                <h2 class="text-center mb-4" style="color: #2E1A47;">Crear Cuenta</h2>
                
                <form id="registerForm">
                  <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="nombre" required>
                  </div>
                  
                  <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Repetir Contraseña</label>
                      <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Fecha de Nacimiento</label>
                    <input type="date" class="form-control" id="fecha_nac" required>
                  </div>

                  <div class="mb-4">
                    <label class="form-label">Deporte Favorito</label>
                    <input type="text" class="form-control" id="deporte">
                  </div>

                  <button type="submit" class="btn w-100 btn-primary-custom">Registrarse</button>
                  
                  <div id="registerMessage" class="mt-3 text-center"></div>

                  <div class="text-center mt-4">
                    <p>¿Ya tienes cuenta? <a href="index.html" style="color: #2E1A47;">Inicia Sesión</a></p>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="register.js"></script>
  </body>
</html>
